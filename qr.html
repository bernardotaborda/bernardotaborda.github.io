<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>qr</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      white-space: pre-wrap;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -khtml-user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
  
<body>
  <div id="qrcode"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://bernardotaborda.com/qr",
      width: 200,
      height: 200
    });
    setTimeout(() => {
      window.location.href = "https://bernardotaborda.com";
    }, 5000);
  </script>
</body>

</html>
