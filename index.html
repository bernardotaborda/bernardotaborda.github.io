<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>bernardotaborda</title>
<link rel="stylesheet" href="main.css">
<link rel="icon" type="image/svg+xml" href="https://github.githubassets.com/favicons/favicon.svg">
</head>

<body>
  <div id="wrapper">
    <div id="content">
      <header id="header">
        <h1>bernardotaborda</h1>
        <div id="clock"></div> 
      </header>
      <nav id ="nav">
        <ul>
          <li>
            <a onclick="window.open('https://github.com/bernardotaborda', '_blank')">github</a>
          </li>
          <li>
            <a onclick="window.open('https://www.linkedin.com/in/bernardotaborda', '_blank')">linkedin</a>
          </li>
          <li>
            <a onclick="window.open('cv.html', '_blank')">cv</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
<script>
function updateClock() {
  const now = new Date();

  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = now.getFullYear();

  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, '0');

  const ampm = hours >= 12 ? 'pm' : 'am';
  hours = hours % 12;
  hours = hours ? hours : 12; // convert 0 → 12
  hours = String(hours).padStart(2, '0');

  document.getElementById('clock').textContent =
    `${day}/${month}/${year} ${hours}:${minutes}${ampm} ${"LIS"}`;
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>

</html>
